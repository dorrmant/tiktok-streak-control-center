
name: Windows Compatibility Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show environment
        run: |
          python --version
          python -m pip --version
          git --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.py |
            Where-Object { $_.FullName -notmatch '\\.git\\|\\.venv\\|\\venv\\|__pycache__' }
          if (-not $files) {
            throw "No Python files found"
          }
          foreach ($file in $files) {
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Syntax check failed: $($file.FullName)"
            }
          }

      - name: Check Windows launcher files
        shell: pwsh
        run: |
          if (-not (Test-Path install.bat)) {
            throw "install.bat is missing"
          }
          if (-not (Test-Path run.bat)) {
            throw "run.bat is missing"
          }
          Write-Host "Windows launcher files exist"

      - name: Report result
        run: echo "Windows dependency and syntax checks passed"
